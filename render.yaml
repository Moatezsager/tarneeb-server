services:
  - type: web
    name: tarneeb-server
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: NODE_ENV
        value: production
      - key: PUBLIC_ORIGIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: gen-lang-client-0141680917
      - key: FIRESTORE_DATABASE_ID
        value: ai-studio-9ac39b13-d4c3-4f49-95ed-89ad16711013
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: ADMIN_UIDS
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-service-account.json
