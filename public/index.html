<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#09131d">
  <title>طرنيب · لوحة الإدارة</title>
  <link rel="stylesheet" href="/admin/style.css">
  <script defer src="https://www.gstatic.com/firebasejs/12.4.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/12.4.0/firebase-auth-compat.js"></script>
  <script defer src="/admin/app.js"></script>
</head>
<body>
<header>
  <div class="brand">
    <span class="mark" aria-hidden="true">♠</span>
    <div><span class="eyebrow">TARNEEB CONTROL ROOM</span><h1>لوحة إدارة طرنيب</h1></div>
  </div>
  <button id="logout" hidden>تسجيل الخروج</button>
</header>
<main>
  <p id="notice" role="status" aria-live="polite"></p>
  <section id="login" class="panel">
    <h2>دخول المسؤول</h2>
    <p>استخدم حساب Firebase المعتمد لإدارة اللعبة.</p>
    <button id="google-login" type="button" class="primary" disabled>الدخول باستخدام Google</button>
    <p id="google-status" role="status">جارٍ تجهيز الدخول عبر Google…</p>
    <form id="login-form">
      <label>البريد الإلكتروني<input id="email" type="email" autocomplete="username" required maxlength="254"></label>
      <label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required maxlength="4096"></label>
      <button class="primary" id="login-button">دخول آمن</button>
    </form>
  </section>
  <section id="dashboard" hidden>
    <div id="metrics" class="metrics"></div>
    <section class="panel maintenance" aria-labelledby="cleanup-title">
      <div><h2 id="cleanup-title">صيانة قاعدة البيانات</h2><p id="cleanup-status" role="status">جارٍ قراءة حالة التنظيف…</p></div>
      <button id="cleanup-button">تنظيف الآن</button>
    </section>
    <nav aria-label="أقسام الإدارة">
      <button data-tab="rooms" aria-pressed="true">الغرف</button>
      <button data-tab="users" aria-pressed="false">المستخدمون والذهب</button>
      <button data-tab="audit" aria-pressed="false">سجل الإدارة</button>
      <button id="refresh">تحديث</button>
    </nav>
    <section class="panel">
      <div class="section-head">
        <div><h2 id="title">الغرف</h2><p id="hint"></p></div>
        <label class="filter">البحث في الصفحة الحالية<input id="filter" type="search" placeholder="الاسم، المعرّف أو الرمز"></label>
      </div>
      <p id="result-count" class="result-count"></p>
      <div class="table-wrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div>
      <button id="more" hidden>الصفحة التالية</button>
    </section>
  </section>
  <dialog id="confirm" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title">تأكيد الإجراء</h2>
      <p id="confirm-text"></p>
      <label id="confirm-field" hidden><span id="confirm-label"></span><input id="confirm-input" autocomplete="off"></label>
      <div class="actions">
        <button value="cancel" formnovalidate>إلغاء</button>
        <button id="confirm-submit" value="confirm" class="danger">تأكيد</button>
      </div>
    </form>
  </dialog>
</main>
<footer>طرنيب ليبيا · إدارة الخادم</footer>
</body>
</html>
